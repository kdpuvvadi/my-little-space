name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          # Repo variable META_SERVICE_URL → baked in as the Customize Advanced default.
          # Leave unset for local-only resolve until the user sets a URL.
          VITE_META_SERVICE_URL: ${{ vars.META_SERVICE_URL }}
        run: npm run build

      - name: Pack zip
        run: |
          TAG="${GITHUB_REF_NAME}"
          SAFE_TAG="${TAG#v}"
          ZIP_NAME="my-little-space-${SAFE_TAG}.zip"
          (
            cd dist
            zip -r "../${ZIP_NAME}" .
          )
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          ls -la "${ZIP_NAME}"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: my-little-space-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
