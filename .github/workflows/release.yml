name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          # Repo variable META_SERVICE_URL → baked in as the Customize Advanced default.
          # Leave unset for local-only resolve until the user sets a URL.
          VITE_META_SERVICE_URL: ${{ vars.META_SERVICE_URL }}
        run: npm run build

      - name: Pack zip
        run: |
          TAG="${GITHUB_REF_NAME}"
          SAFE_TAG="${TAG#v}"
          ZIP_NAME="my-little-space-${SAFE_TAG}.zip"
          (
            cd dist
            zip -r "../${ZIP_NAME}" .
          )
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          ls -la "${ZIP_NAME}"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: my-little-space-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-site-meta-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          SAFE_TAG="${TAG#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mls-site-meta"
          # lowercase for GHCR
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${SAFE_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./service
          file: ./service/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.full_tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
