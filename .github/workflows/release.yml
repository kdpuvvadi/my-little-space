name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  dist:
    uses: ./.github/workflows/build-dist.yml

  chrome:
    needs: dist
    uses: ./.github/workflows/release-chrome.yml
    secrets: inherit

  safari:
    needs: dist
    uses: ./.github/workflows/release-safari.yml
    secrets: inherit

  site-meta:
    uses: ./.github/workflows/release-site-meta.yml
    secrets: inherit
